name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Select Laravel
        run: composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-update --no-interaction
      - name: Install latest compatible dependencies
        run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - run: composer test:unit

